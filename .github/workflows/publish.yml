# Publishes images to ghcr.io on every merge to main,
# then bumps the uat overlay in the manifests repo.
#
# Not a required status check — this runs after the merge.
# Prod overlays are intentionally NOT bumped: they pin a released semver tag.

name: Publish

on:
  push:
    branches: [main]

concurrency:
  group: publish-main
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  MANIFESTS_REPO: mehrd-resource-hub-manifests

jobs:
  publish:
    name: Publish images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push cms
        uses: docker/build-push-action@v6
        with:
          context: ./cms
          push: true
          tags: ghcr.io/${{ github.repository }}/cms:${{ github.sha }}
          cache-from: type=gha,scope=cms
          cache-to: type=gha,mode=max,scope=cms

      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: ./web
          push: true
          tags: ghcr.io/${{ github.repository }}/web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Summary
        run: |
          echo "### Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${{ github.repository }}/cms:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${{ github.repository }}/web:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY

  bump-manifests:
    name: Bump uat manifests
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Generate installation token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.MANIFESTS_APP_ID }}
          private-key: ${{ secrets.MANIFESTS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ env.MANIFESTS_REPO }}

      - name: Checkout manifests
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/${{ env.MANIFESTS_REPO }}
          token: ${{ steps.app-token.outputs.token }}
          path: manifests

      - name: Bump uat web image tag
        working-directory: manifests/workloads/web/overlays/uat
        env:
          IMAGE: ghcr.io/${{ github.repository }}/web
        run: |
          kustomize edit set image "$IMAGE=$IMAGE:${{ github.sha }}"

      - name: Commit and push
        working-directory: manifests
        run: |
          git config user.name  "mehrd-bot[bot]"
          git config user.email "mehrd-bot[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git add -A
          git commit -m "chore(uat): bump web to ${GITHUB_SHA::7}

          Source: ${{ github.repository }}@${{ github.sha }}"
          git push
