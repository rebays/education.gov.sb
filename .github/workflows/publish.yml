# Publishes images to ghcr.io on every merge to main.
#
# Not a required status check — this runs after the merge.
#
# The manifest-repo bump step is deliberately absent. Add it once the
# manifest repo and its deployment.yaml files exist.

name: Publish

on:
  push:
    branches: [main]

concurrency:
  group: publish-main
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push cms
        uses: docker/build-push-action@v6
        with:
          context: ./cms
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/cms:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${{ github.repository_owner }}/cms:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
